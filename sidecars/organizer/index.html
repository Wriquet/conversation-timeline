<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'">
  <title>Conversation Timeline</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="搜索英文/中文标题、内容或日期（如 11-11）"
          autocomplete="off"
          spellcheck="false"
        >
        <button id="search-clear" class="icon-btn search-clear hidden" type="button" aria-label="Clear">✕</button>
      </div>

      <div class="toolbar">
        <div class="seg-group" role="group" id="group-mode-seg">
          <button type="button" class="seg-btn active" data-group-mode="ymd" id="btn-mode-ymd">年/月/日</button>
          <button type="button" class="seg-btn" data-group-mode="ym" id="btn-mode-ym">年/月</button>
        </div>

        <div class="seg-group" role="group" id="time-field-seg">
          <button type="button" class="seg-btn active" data-time-field="created" id="btn-time-created">发起日</button>
          <button type="button" class="seg-btn" data-time-field="updated" id="btn-time-updated">活跃日</button>
        </div>

        <select id="workspace-select" class="ws-select hidden" aria-label="Project Filter">
          <option value="">全部项目</option>
        </select>

        <div class="toolbar-spacer"></div>

        <div class="translate-split" id="translate-split">
          <button id="translate-toggle-btn" class="translate-main-btn" type="button" title="一键切换英文原标题 / 中文翻译">
            <svg class="tr-icon" width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.2 4.2h6.6M5.5 2.4v1.8M3.6 4.2c.3 2.5 1.8 4.6 4.2 5.8M7.3 4.2c-.5 2.3-2 4.4-4.6 5.8" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
              <path d="M8.7 13.4l2.4-6.2 2.4 6.2M9.5 11.5h3.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="translate-btn-label">译中文</span>
            <span id="translate-busy-dot" class="busy-dot hidden" aria-hidden="true"></span>
          </button>
          <button id="translate-cfg-btn" class="translate-gear-btn" type="button" title="配置微软翻译服务" aria-label="Translation Settings">
            <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
              <circle cx="5.5" cy="4.5" r="1.5" fill="var(--tl-bg)" stroke="currentColor" stroke-width="1.3"/>
              <circle cx="10.5" cy="8" r="1.5" fill="var(--tl-bg)" stroke="currentColor" stroke-width="1.3"/>
              <circle cx="6.5" cy="11.5" r="1.5" fill="var(--tl-bg)" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <span id="ms-key-dot" class="ms-key-dot hidden" aria-hidden="true"></span>
          </button>
        </div>

        <button id="toggle-cal-btn" class="ghost-btn active" type="button">日历</button>
        <button id="fold-toggle-btn" class="ghost-btn" type="button">收起全部</button>
        <button id="lang-toggle-btn" class="ghost-btn" type="button" title="Switch UI Language / 切换界面语言">EN</button>
      </div>
    </header>

    <section id="translate-panel" class="translate-panel hidden" aria-label="Translation Settings">
      <div class="tr-header">
        <span id="tr-panel-title" class="tr-panel-title">微软翻译服务配置</span>
        <span id="tr-status-badge" class="tr-badge">免密自动模式</span>
        <div class="toolbar-spacer"></div>
        <button id="tr-panel-close" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>

      <div class="tr-row">
        <div class="seg-group" role="group" id="tr-provider-seg">
          <button type="button" class="seg-btn active" data-tr-provider="auto" id="btn-tr-auto">自动优先微软</button>
          <button type="button" class="seg-btn" data-tr-provider="microsoft" id="btn-tr-ms">仅微软官方</button>
          <button type="button" class="seg-btn" data-tr-provider="free" id="btn-tr-free">免费公共接口</button>
        </div>
      </div>

      <div id="tr-ms-fields" class="tr-fields">
        <div class="tr-key-wrap">
          <input
            id="tr-ms-key"
            class="tr-input"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="粘贴微软 Azure Translator 免费 Key（F0 层 200万字/月，可留空）"
          >
          <button id="tr-clear-key-btn" class="text-link-btn hidden" type="button">清除 Key</button>
        </div>
        <div class="tr-grid-2">
          <input
            id="tr-ms-region"
            class="tr-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Region（如 eastasia / global）"
          >
          <input
            id="tr-ms-endpoint"
            class="tr-input"
            type="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://api.cognitive.microsofttranslator.com"
          >
        </div>
      </div>

      <p id="tr-note" class="tr-note">
        未填 Key 时默认通过免费接口即点即译并本地永久缓存；填入微软免费 F0 Key 后自动切换为微软官方批量接口。
      </p>

      <div class="tr-actions">
        <button id="tr-clear-cache-btn" class="text-link-btn" type="button">清空译文缓存</button>
        <div class="toolbar-spacer"></div>
        <button id="tr-test-btn" class="ghost-btn" type="button">测试连接</button>
        <button id="tr-save-btn" class="ghost-btn active" type="button">保存配置</button>
      </div>
    </section>

    <section id="calendar-panel" class="calendar-panel" aria-label="Monthly Calendar">
      <div class="cal-header">
        <button id="cal-prev" class="icon-btn" type="button" aria-label="Previous Month">‹</button>
        <button id="cal-title" class="cal-title-btn" type="button"></button>
        <button id="cal-next" class="icon-btn" type="button" aria-label="Next Month">›</button>
        <div class="toolbar-spacer"></div>
        <button id="cal-today" class="text-link-btn" type="button">今天</button>
        <button id="cal-clear-filter" class="text-link-btn accent hidden" type="button">显示全部日期</button>
      </div>
      <div id="cal-weekdays" class="cal-weekdays" aria-hidden="true"></div>
      <div id="cal-grid" class="cal-grid" role="grid"></div>
    </section>

    <div id="summary-bar" class="summary-bar">
      <span id="summary-text">正在读取历史对话…</span>
      <button id="refresh-btn" class="text-link-btn" type="button">刷新</button>
    </div>

    <main id="tree-root" class="tree-root" role="tree" aria-label="Conversation Timeline Tree">
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
