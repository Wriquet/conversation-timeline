name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin manifests & syntax
        shell: node {0}
        run: |
          import { existsSync, readFileSync } from 'node:fs';
          const plugin = JSON.parse(readFileSync('plugin.json', 'utf8'));
          if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(plugin.name)) throw new Error('Invalid plugin.name');
          if (!existsSync(plugin.logo)) throw new Error('Missing logo file: ' + plugin.logo);
          const sidecar = JSON.parse(readFileSync('sidecars/organizer/sidecar.json', 'utf8'));
          if (!sidecar.has_web_ui || !sidecar.ui_config?.views?.length) throw new Error('Invalid sidecar.json UI config');
          const skill = readFileSync('skills/conversation-timeline/SKILL.md', 'utf8');
          if (!/^---\r?\nname:\s*conversation-timeline\r?\n/m.test(skill)) throw new Error('Skill name mismatch');
          console.log('Manifest validation passed.');

      - name: Check JS syntax
        run: |
          node --check sidecars/organizer/lib.mjs
          node --check sidecars/organizer/main.mjs
          node --check sidecars/organizer/app.js

      - name: Run unit tests
        working-directory: sidecars/organizer
        run: npm test
